[resolve]
alias = { 
  "@" = "./apps/api/src",
  "@/api" = "./apps/api/src"
}

[test]
root = "./apps/api/src"
timeout = 10000
coverage = false
coverageDir = "./apps/api/coverage"
coverageThreshold = { lines = 0.80, functions = 0.75, statements = 0.80 }
coverageSkipTestFiles = true
preload = ["./apps/api/src/tests/setup.ts"]

[test.coverageExclude]
"**/*.test.ts" = true